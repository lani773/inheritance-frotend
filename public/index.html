<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#C9A84C" />
    <meta name="description" content="INHERITANCE CHOIR — Complete Choir Management System" />

    <!-- ── Google Fonts ───────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ── PWA Manifest ──────────────────────────────────────── -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Favicon ───────────────────────────────────────────── -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>" />

    <title>INHERITANCE CHOIR — Management System</title>

    <!-- ── Prevent flash of unstyled content ─────────────────── -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        background: #080C14;
        min-height: 100vh;
      }
      /* Loading screen shown before React mounts */
      #app-loading {
        position: fixed;
        inset: 0;
        background: #080C14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #app-loading .logo {
        font-size: 64px;
        margin-bottom: 16px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      #app-loading .text {
        font-family: 'Cinzel', serif;
        font-size: 14px;
        color: #C9A84C;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50%       { opacity: 1;   transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen (removed once React mounts) -->
    <div id="app-loading">
      <div class="logo">♪</div>
      <div class="text">INHERITANCE CHOIR</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Remove loading screen once React renders
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('app-loading');
          if (el) {
            el.style.opacity = '0';
            el.style.transition = 'opacity 0.4s ease';
            setTimeout(function () { el.remove(); }, 400);
          }
        }, 200);
      });
    </script>
  </body>
</html>
